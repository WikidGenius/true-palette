name: Decode bootstrap payload

on:
  push:
    paths:
      - 'bootstrap/*.json'

permissions:
  contents: write

concurrency:
  group: decode-bootstrap-payload
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode payload
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const zlib=require('zlib');
          if(!fs.existsSync('bootstrap'))process.exit(0);
          const files=fs.readdirSync('bootstrap').filter(name=>name.endsWith('.json'));
          for(const name of files){
            const source=path.join('bootstrap',name);
            const payload=JSON.parse(fs.readFileSync(source,'utf8'));
            fs.mkdirSync(path.dirname(payload.path),{recursive:true});
            fs.writeFileSync(payload.path,zlib.gunzipSync(Buffer.from(payload.data,'base64')));
            fs.unlinkSync(source);
            fs.writeFileSync('.bootstrap-message',payload.message||'Decode application payload');
          }
          NODE
      - name: Commit decoded file
        run: |
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$(cat .bootstrap-message 2>/dev/null || echo 'Decode application payload')"
          rm -f .bootstrap-message
          git push
