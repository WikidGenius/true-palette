name: Apply production refactor

on:
  push:
    paths:
      - tools/refactor/READY

permissions:
  contents: write

concurrency:
  group: production-refactor
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble canonical source
        shell: bash
        run: |
          mkdir -p app/tinter tests scripts .github/workflows
          cat tools/refactor/survey.part-* > app/tinter/survey.js
          cat tools/refactor/ui.part-* > app/tinter/ui.js
          cat tools/refactor/css.part-* > app/tinter/tinter.css
          cp tools/refactor/index.html index.html
          cp tools/refactor/check-active-js.mjs scripts/check-active-js.mjs
          cp tools/refactor/tinter-survey.test.mjs tests/tinter-survey.test.mjs
          cp tools/refactor/app-quality.yml .github/workflows/app-quality.yml

      - name: Remove obsolete adjustment layers
        shell: bash
        run: |
          rm -f \
            app/tinter-optimized.css \
            app/tinter-first.css \
            app/tinter-usability-v8.css \
            app/tinter-immersive-v9.css \
            app/tinter-gesture-v9.css \
            app/tinter-intelligence-v11.css \
            app/tinter-cleanup-v12.css \
            app/tinter-help-v15.css \
            app/tinter-minimal-v16.css \
            app/tinter-survey-v11.js \
            app/tinter-language-v11.js \
            app/tinter-runtime-v11-scope-fix.js \
            app/tinter-runtime-v11.js \
            app/tinter-usability-v8.js \
            app/tinter-immersive-v9.js \
            app/tinter-return-v13.js \
            app/tinter-help-v15.js \
            app/tinter-minimal-v16.js \
            tests/tinter-survey-v11.test.mjs
          rm -rf tools/refactor .github/workflows/apply-production-refactor.yml

      - name: Validate refactored app
        run: |
          node scripts/check-active-js.mjs
          node tests/tinter-survey.test.mjs

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refactor Tinter into production architecture"
          git push
