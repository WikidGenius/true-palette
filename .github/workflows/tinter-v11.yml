name: Tinter v11 checks

on:
  push:
    paths:
      - 'app/tinter-survey-v11.js'
      - 'app/tinter-runtime-v11.js'
      - 'app/season-hybrid-v11.js'
      - 'app/profile-v11.js'
      - 'app/report-ui-v11.js'
      - 'test/tinter-v11.test.mjs'
      - '.github/workflows/tinter-v11.yml'
  pull_request:
    paths:
      - 'app/tinter-survey-v11.js'
      - 'app/tinter-runtime-v11.js'
      - 'app/season-hybrid-v11.js'
      - 'app/profile-v11.js'
      - 'app/report-ui-v11.js'
      - 'test/tinter-v11.test.mjs'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app/tinter-survey-v11.js
          node --check app/tinter-runtime-v11.js
          node --check app/season-hybrid-v11.js
          node --check app/profile-v11.js
          node --check app/report-ui-v11.js
      - name: Adaptive survey tests
        run: node test/tinter-v11.test.mjs
