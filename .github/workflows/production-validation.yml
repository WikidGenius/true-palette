name: Production validation

on:
  push:
    paths:
      - .github/workflows/production-validation.yml

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate production architecture
        run: |
          node scripts/check-active-js.mjs
          node tests/tinter-survey.test.mjs

      - name: Remove obsolete Tinter layers
        shell: bash
        run: |
          rm -f \
            app/tinter-optimized.css \
            app/tinter-first.css \
            app/tinter-usability-v8.css \
            app/tinter-immersive-v9.css \
            app/tinter-gesture-v9.css \
            app/tinter-intelligence-v11.css \
            app/tinter-cleanup-v12.css \
            app/tinter-help-v15.css \
            app/tinter-minimal-v16.css \
            app/tinter-survey-v11.js \
            app/tinter-language-v11.js \
            app/tinter-runtime-v11-scope-fix.js \
            app/tinter-runtime-v11.js \
            app/tinter-usability-v8.js \
            app/tinter-immersive-v9.js \
            app/tinter-return-v13.js \
            app/tinter-help-v15.js \
            app/tinter-minimal-v16.js \
            tests/tinter-survey-v11.test.mjs
          rm -rf tools/refactor
          rm -f .github/workflows/apply-production-refactor.yml .github/workflows/production-validation.yml

      - name: Record validation
        shell: bash
        run: |
          cat > PRODUCTION_READINESS.md <<'EOF'
          # Production readiness

          The canonical Tinter architecture passed JavaScript syntax, active-source, contract, and deterministic adaptive-survey checks.

          ## Completed
          - Canonical survey, UI, camera, and application modules
          - Single canonical Tinter stylesheet
          - No active versioned adjustment layers
          - Adaptive survey and hybrid-result contracts
          - Automated source validation and deterministic survey tests

          ## Release gates still requiring human/device verification
          - iPhone Safari camera and gesture QA
          - Android Chrome camera and gesture QA
          - Keyboard and screen-reader audit
          - Performance and offline/PWA audit
          - Privacy, analytics, and error-monitoring decisions
          EOF

      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate production Tinter architecture"
          git push
